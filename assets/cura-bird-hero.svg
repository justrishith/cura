<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" role="img" aria-label="Cura — the little bird that checks in">
  <style>
    .bird { animation: bob 2.6s ease-in-out infinite; transform-origin: 110px 90px; }
    .wing { animation: flutter 2.6s ease-in-out infinite; transform-origin: 96px 100px; }
    .note1 { animation: rise1 2.6s ease-in-out infinite; opacity: 0; }
    .note2 { animation: rise2 3.4s ease-in-out .9s infinite; opacity: 0; }
    .ground { animation: nudge 2.6s ease-in-out infinite; }
    @keyframes bob {
      0%,100% { transform: translateY(0) rotate(0deg); }
      45% { transform: translateY(-5px) rotate(-1.2deg); }
      62% { transform: translateY(-7px) rotate(-1.8deg); }
    }
    @keyframes flutter {
      0%,58%,100% { transform: rotate(0deg); }
      74% { transform: rotate(-9deg); }
      86% { transform: rotate(-4deg); }
    }
    @keyframes rise1 {
      0%, 52% { opacity: 0; transform: translate(0,0); }
      62% { opacity: .9; transform: translate(3px,-6px); }
      82% { opacity: 0; transform: translate(7px,-15px); }
      100% { opacity: 0; transform: translate(7px,-15px); }
    }
    @keyframes rise2 {
      0% { opacity: 0; transform: translate(0,0); }
      18% { opacity: .8; transform: translate(4px,-7px); }
      44% { opacity: 0; transform: translate(10px,-18px); }
      100% { opacity: 0; transform: translate(10px,-18px); }
    }
    @keyframes nudge {
      0%,62%,100% { transform: translateX(0); }
      74% { transform: translateX(1.5px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bird, .wing, .note1, .note2, .ground { animation: none; }
      .note1, .note2 { opacity: .55; }
    }
    text { font-family: Georgia, 'Times New Roman', serif; fill: #35422d; }
  </style>

  <!-- ground line -->
  <g class="ground">
    <line x1="42" y1="125" x2="185" y2="125" stroke="#d8cdb6" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- perched bird (Cura's mascot, in brand colors) -->
  <g class="bird">
    <!-- tail — swept back, clay -->
    <path d="M74 96 Q 63 88 60 93 Q 67 95 66 103 Q 71 102 75 105 Z" fill="#694737"/>
    <!-- body + head silhouette (moss) -->
    <circle cx="100" cy="87" r="10.5" fill="#35422d"/>
    <ellipse cx="88" cy="100" rx="17.5" ry="14.5" fill="#35422d"/>
    <!-- wing — folded, clay (flutters when she sings) -->
    <g class="wing">
      <ellipse cx="86" cy="101" rx="10.5" ry="7" fill="#694737" transform="rotate(-18 86 101)"/>
    </g>
    <!-- beak — fired-clay (opens slightly on the flutter frame) -->
    <path d="M108.5 82.5 L120 87.5 L108.5 91.5 Z" fill="#ad7d62"/>
    <!-- eye — sand -->
    <circle cx="103.5" cy="84.5" r="1.9" fill="#eee6d6"/>
    <!-- legs — porcelain wires -->
    <path d="M87 114 L86 121 M93 114 L94 121" stroke="#694737" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- song notes rising from the beak -->
  <g class="note1" fill="#b08a6e">
    <text x="126" y="74" font-size="15">&#9834;</text>
  </g>
  <g class="note2" fill="#b08a6e">
    <text x="134" y="64" font-size="12">&#9835;</text>
  </g>

  <!-- wordmark -->
  <text x="150" y="86" font-size="58" font-weight="600">cura</text>
  <text x="152" y="114" font-family="Verdana, sans-serif" font-size="15" fill="#8a7a63">Care between visits.</text>
</svg>
